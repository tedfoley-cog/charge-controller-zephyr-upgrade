# Work streams for the OS upgrade. `owns` globs are disjoint inside a wave so
# the tickets of one wave can be worked in parallel without merge conflicts.
integration_branch: upgrade/zephyr-4.3
epic:
  summary: "Upgrade charge-controller firmware from Zephyr v3.2 to v4.3"
streams:
  - id: foundation
    wave: 0
    title: "Foundation: Zephyr v4.3 workspace, Kconfig, test harness, reference board"
    boards: [mppt_2420_lc]
    finding_streams: [foundation]
    owns:
      - west.yml
      - zephyr/**
      - app/CMakeLists.txt
      - app/prj.conf
      - app/Kconfig
      - tests/**
      - boards/*/mppt_2420_lc/**
      - dts/**
      - scripts/**
      - .github/**
    acceptance:
      - "west.yml tracks zephyrproject-rtos v4.3-branch; `make test` runs on native_sim"
      - "All existing unit tests pass on Zephyr v4.3 (none removed, none skipped)"
      - "Reference board mppt_2420_lc builds under hardware model v2 inside the flash budget"
      - "Board and devicetree roots are declared in zephyr/module.yml"
    gate: "python3 tools/migrate/gate.py --ticket foundation --boards mppt_2420_lc"
  - id: can
    wave: 1
    title: "CAN boards: FDCAN devicetree and CAN / ISO-TP flags API"
    boards: [mppt_2420_hc, mppt_2420_rc]
    finding_streams: [can]
    owns:
      - boards/*/mppt_2420_hc/**
      - boards/*/mppt_2420_rc/**
      - app/src/ext/can.cpp
      - app/src/ext/can_msg*
      - tests/src/tests_can*
    acceptance:
      - "mppt_2420_hc and mppt_2420_rc build under hardware model v2 with CAN enabled"
      - "CAN frames and filters use the flags API; ISO-TP uses fixed addressing flags"
      - "New unit tests pin the CAN identifier and filter-mask layout used on the bus"
    gate: "python3 tools/migrate/gate.py --ticket can --boards mppt_2420_hc,mppt_2420_rc --base-ref origin/upgrade/zephyr-4.3"
  - id: mppt-lowpower
    wave: 1
    title: "MPPT boards without CAN: mppt_1210_hus and mppt_2420_hpx to hardware model v2"
    boards: [mppt_1210_hus, mppt_2420_hpx]
    finding_streams: []
    owns:
      - boards/*/mppt_1210_hus/**
      - boards/*/mppt_2420_hpx/**
    acceptance:
      - "Both boards build under hardware model v2, all revisions declared in board.yml"
      - "Flash stays inside the +8% budget and SRAM fits"
    gate: "python3 tools/migrate/gate.py --ticket mppt-lowpower --boards mppt_1210_hus,mppt_2420_hpx --base-ref origin/upgrade/zephyr-4.3"
  - id: pwm
    wave: 1
    title: "PWM controller board: pwm_2420_lus to hardware model v2"
    boards: [pwm_2420_lus]
    finding_streams: []
    owns:
      - boards/*/pwm_2420_lus/**
    acceptance:
      - "pwm_2420_lus builds under hardware model v2, all revisions declared in board.yml"
      - "Flash stays inside the +8% budget and SRAM fits"
    gate: "python3 tools/migrate/gate.py --ticket pwm --boards pwm_2420_lus --base-ref origin/upgrade/zephyr-4.3"
  - id: numerics
    wave: 1
    title: "Control maths: remove double-precision promotion, pin behaviour with tests"
    boards: []
    finding_streams: [numerics]
    owns:
      - app/src/*.cpp
      - app/src/*.c
      - app/src/*.h
      - tests/src/tests_numerics*
    acceptance:
      - "Characterization tests for NTC temperature, ADC scaling and charger thresholds are added first and pass before and after the change"
      - "No double-precision literals or maths remain in the control path"
      - "No new compiler warnings in application code"
    gate: "python3 tools/migrate/gate.py --ticket numerics --tests-only --base-ref origin/upgrade/zephyr-4.3"
  - id: integration
    wave: 2
    title: "Integration: all boards and tests on Zephyr v4.3, release gate"
    boards: []
    finding_streams: []
    owns: []
    acceptance:
      - "Every board builds on Zephyr v4.3 inside its flash and SRAM budget"
      - "Unit test count is at or above the v3.2 baseline, zero failures"
      - "`make scan --check` reports no breaking findings"
    gate: "python3 tools/migrate/gate.py --ticket integration --require-all-boards"
